<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/cause.css">

    <script type="module" src="script/cause.js" defer></script>
    <title>Kind Link</title>
</head>
<body>
    <header>
        <h1>Kind Link</h1>

        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="one verified">
            <img src="" alt="" class="main-image">
            <div>
                <h2 class="title"></h2>
                <p class="description">
                </p>

                <div class="amounts">
                    <p class="raised-target">
                        <span class="raised">$ 0,00 </span>
                        <span class="target">$ 0,00</span>
                    </p>
                    <div class="progress-bar">
                        <div class="progress-achieved">
                        </div>                    
                    </div>
                </div>  
                
                <button class="donate">Donate Now</button>
            </div>            
        </section>

        <section class="details">
            <div>
                <p><i class="fa-regular fa-heart"></i> Category</p>
                <p class="category"></p>
            </div>

            <div>
                <p><i class="fa-regular fa-calendar"></i> Created in</p>
                <p class="created"></p>            
            </div>

            <div>
                <p><i class="fa-solid fa-location-dot"></i> Location</p>
                <p class="location"></p> 
            </div>

            <div>
                <p><i class="fa-solid fa-users"></i> Beneficiary</p>
                <p class="beneficiary"></p> 
            </div>
        </section>
                
        <section class="about">
            <div>
                <img src="" alt="" class="about-image">
                <h3>About</h3>
                <!-- <p class="about-text"></p> -->
            </div>
        </section>        
    </main>

    <footer>
    </footer>
</body>
</html>
